<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SportZone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <h1>SportZone</h1>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li><a href="#">Descuentos</a></li>
                <li><a href="#">Mi cuenta</a></li>
            </ul>
        </nav>
    </header>

    <!-- PANTALLA INICIAL -->
    <section id="inicio">
        <h2>Bienvenido a SportZone</h2>
        <p>La mejor tienda deportiva</p>
        <button onclick="mostrarTienda()">Iniciar</button>
    </section>

    <!-- PRODUCTOS (oculto al inicio) -->
    <section id="tienda" style="display: none;">
        <h2>Productos</h2>

        <div class="productos">

            <div class="card">
                <h3>Balón de fútbol</h3>
                <p>$500</p>
            </div>

            <div class="card">
                <h3>Tenis deportivos</h3>
                <p>$1200</p>
            </div>

            <div class="card">
                <h3>Playera deportiva</h3>
                <p>$350</p>
            </div>

            <div class="card">
                <h3>Pesas</h3>
                <p>$800</p>
            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 SportZone</p>
    </footer>

    <script>
        function mostrarTienda() {
            document.getElementById("inicio").style.display = "none";
            document.getElementById("tienda").style.display = "block";
        }
    </script>

</body>
</html>
